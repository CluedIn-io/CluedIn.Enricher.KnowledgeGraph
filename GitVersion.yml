mode: ContinuousDeployment
# The CluedIn version is now encoded in the published package suffix (e.g. .470/.480/.500), so this
# repo's own version no longer needs to track CluedIn. Reset to 1.0. commits-before is padded to
# well over 2 days past the highest pre-existing tag (4.6.2, 2026-06-17T17:25:56+10:00) -
# GitVersion.Tool 5.9.0 appears to parse this cutoff using local machine time, not UTC, so a
# same-day/1-day margin can silently fail to exclude the tag.
next-version: 1.0
ignore:
  commits-before: 2026-06-20T00:00:00
branches:
  master:
    mode: ContinuousDelivery
  pull-request:
    tag: pr
    increment: None
  develop:
    tag: alpha
  hotfix:
    tag: useBranchName
  ama:
    increment: None
    tracks-release-branches: false
    regex: ^ama[/-]
    is-release-branch: false
    mode: ContinuousDeployment
    track-merge-target: false
    tag: ama
    pre-release-weight: 30000
    prevent-increment-of-merged-branch-version: true
    is-mainline: false
    source-branches:
    - main
    - develop

